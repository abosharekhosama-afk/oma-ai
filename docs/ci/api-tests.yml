name: api-tests
# API contract / integration / security suites against a real Postgres + Redis.
# Separate from `ci` so a pre-existing unit/format failure there never hides an API regression.
on:
  pull_request:
    branches: ['004-oma-complete-product-demo']
  push:
    branches: ['004-oma-complete-product-demo']
concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oma
          POSTGRES_PASSWORD: oma
          POSTGRES_DB: oma_ai_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oma -d oma_ai_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://oma:oma@127.0.0.1:5432/oma_ai_ci?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      API_PORT: '3001'
      WEB_ORIGIN: http://127.0.0.1:3000
      API_PUBLIC_URL: http://127.0.0.1:3001
      SESSION_COOKIE_NAME: oma_session
      SESSION_TTL_SECONDS: '604800'
      CSRF_COOKIE_NAME: oma_csrf
      BOOTSTRAP_PLATFORM_OWNER_EMAIL: platform-owner@example.com
      BOOTSTRAP_PLATFORM_OWNER_PASSWORD: ChangeMe_PlatformOwner_1!
      WEB_BASE_URL: http://127.0.0.1:3000
      WORKER_HEALTH_PORT: '3002'
      MAIL_PROVIDER: recording
      OMA_WRITE_OPENAPI: '0'
      BRAND_FIXTURE_CONNECTOR: '1'
      BRAND_FIXTURE_FETCH_DELAY_MS: '600'
      OMA_DEMO_MODE: '1'
      RATE_LIMIT_PER_MINUTE: '0'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm --filter @oma/api bootstrap:platform-owner
      - name: Analytics, cache and timezone unit tests
        run: pnpm exec vitest run tests/unit/analytics-content.test.ts tests/unit/work-analytics.test.ts tests/unit/analytics-cache.test.ts tests/unit/analytics-timezone.test.ts tests/unit/planable-home.test.ts
      - name: API contract, integration and security suites
        run: pnpm exec vitest run tests/contract tests/integration tests/security
