services:
  postgres:
    image: postgres:16
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: oma
      POSTGRES_PASSWORD: oma
      POSTGRES_DB: oma_ai
    volumes:
      - oma_pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - '6379:6379'
volumes:
  oma_pg:
